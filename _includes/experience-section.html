<!-- experience -->
<section class="section pt-0" id="experience">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <h3 class="section-title-sm">{{ site.data.settings['experience-title'] }}</h3>
        <ul class="timeline list-unstyled mb-0">
          {% for item in site.data.settings.experience %}
          <li class="timeline-item">
            <h4 class="timeline-role">{{ item.role }}</h4>
            <p class="timeline-meta mb-0">
              <span class="timeline-org">{{ item.org }}</span><span class="timeline-sep">·</span>{{ item.date }}<span class="timeline-sep">·</span>{{ item.location }}
            </p>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</section>
<!-- /experience -->
