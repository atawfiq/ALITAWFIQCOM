baseurl: "" # the subpath of your site, e.g. /blog
url: "https://alitawfiq.com" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-sitemap
compress_html:
  clippings: all
  comments: all
  # NOTE: do NOT strip the <head> opening tag. LinkedIn (and other OG
  # parsers) scope <meta property="og:*"> extraction to <head>; without
  # the opening tag they extract no OG data at all.
  startings: [html, body]

# Pages Path
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext

include:
  - _pages

sass:
  sass_dir: assets/scss
  style: compressed

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE.text
  - README.md
  - SECURITY.md
  - CLAUDE_CODE_HANDOFF.md
  - vendor
  - .bundle
